# youtube-safe: Server, Datenbank, Push.
# Start:  docker compose --env-file .env up -d --build
#
# NPM erreicht App und Push über das gemeinsame Netz `paqo-net` per Containername
# (safetube-app:8080, safetube-ntfy:80). Die Dienstnamen sind bewusst eindeutig:
# Compose trägt sie in jedem Netz als DNS-Alias ein, und in `paqo-net` gibt es
# bereits einen anderen Container `ntfy`. Die Datenbank bleibt im internen Netz.
services:
  safetube-app:
    build: ../server
    container_name: safetube-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      NTFY_URL: http://safetube-ntfy
      YTS_UPDATES_DIR: /srv/updates
    volumes:
      - ./updates:/srv/updates:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?MARIADB_DATABASE fehlt}
      MARIADB_USER: ${MARIADB_USER:?MARIADB_USER fehlt}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD fehlt}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD fehlt}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  safetube-ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: safetube-ntfy
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:?NTFY_PUBLIC_URL fehlt}
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-data:/var/lib/ntfy
    networks:
      - default
      - proxy

networks:
  default:
  proxy:
    external: true
    name: ${YTS_PROXY_NETWORK:-paqo-net}

volumes:
  db-data:
  ntfy-data:
